<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2a1a">
<title>皇室奇兵 · 移动端对战</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d140d;
    font-family:"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }

  /* 固定逻辑竖屏舞台 450x800，整体 CSS 等比缩放，触摸坐标统一映射 */
  #stage {
    position:relative;
    width:450px; height:800px;
    transform-origin:center center;
    background:#2e7d32;
    overflow:hidden;
    box-shadow:0 0 24px rgba(0,0,0,.7);
    border-radius:6px;
    touch-action:none;
  }
  canvas#cv { position:absolute; left:0; top:0; width:450px; height:800px; display:block; touch-action:none; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column; z-index:5; }
  .screen.show { display:flex; }

  /* ---------- 通用 ---------- */
  .btn {
    border:none; border-radius:14px; font-weight:bold; color:#fff; cursor:pointer;
    font-size:17px; padding:13px 18px; box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.28); }
  .btn-primary { background:linear-gradient(#5ec85e,#3a9e3a); }
  .btn-blue { background:linear-gradient(#5ab0ff,#2b78d4); }
  .btn-grey { background:linear-gradient(#9aa4ad,#6b747c); }
  .btn-gold { background:linear-gradient(#ffd24d,#e0a020); color:#4a2e00; }
  .btn:disabled { filter:grayscale(.7) brightness(.8); box-shadow:none; }

  /* ---------- 主界面 ---------- */
  #home {
    background:
      radial-gradient(circle at 30% 12%, rgba(255,255,255,.14), transparent 42%),
      linear-gradient(160deg,#3f8fd6 0%,#2b5fa8 40%,#274b30 41%,#2e7d32 100%);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  .topbar { display:flex; gap:8px; }
  .pill {
    flex:1; background:rgba(0,0,0,.42); border:2px solid rgba(255,255,255,.22);
    border-radius:12px; padding:7px 10px; color:#fff; font-size:13px; text-align:center;
  }
  .pill b { display:block; font-size:18px; }
  .logo { text-align:center; margin:26px 0 8px; color:#fff; text-shadow:0 3px 0 #1a3d1a, 0 0 18px rgba(255,220,90,.5); }
  .logo h1 { font-size:42px; letter-spacing:3px; }
  .logo p { font-size:13px; opacity:.85; margin-top:4px; }
  .deckArea { margin:14px 6px; background:rgba(0,0,0,.34); border:2px solid rgba(255,255,255,.18); border-radius:14px; padding:10px; }
  .deckArea h3 { color:#ffe9a0; font-size:13px; margin-bottom:8px; font-weight:normal; }
  .deckRow { display:flex; gap:6px; justify-content:space-between; }
  .deckRow .mini {
    flex:1; aspect-ratio:3/4; border-radius:8px; background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25); display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; position:relative;
  }
  .deckRow .mini .ic { font-size:22px; }
  .deckRow .mini .lv { position:absolute; top:1px; right:3px; font-size:10px; color:#ffe080; font-weight:bold; }
  .deckRow .mini .cost { position:absolute; bottom:1px; left:3px; font-size:11px; font-weight:bold; color:#9fe0ff; }
  .mainBtns { margin-top:auto; display:flex; flex-direction:column; gap:12px; padding:0 14px; }
  .topbtns { display:flex; gap:10px; }
  .topbtns .btn { flex:1; font-size:15px; padding:11px 8px; }

  /* ---------- 卡牌收集 ---------- */
  #collection {
    background:linear-gradient(180deg,#26303f,#1a2230);
    padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
  }
  .collHead { display:flex; align-items:center; gap:10px; color:#fff; margin-bottom:8px; }
  .collHead h2 { font-size:19px; flex:1; }
  .collHead .back { width:42px; height:38px; font-size:20px; padding:0; }
  .cardGrid { flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:2px 2px 12px; -webkit-overflow-scrolling:touch; }
  .cardCell {
    background:linear-gradient(170deg,#f4ecd8,#d8c8a4); border:3px solid #8a6d3c;
    border-radius:12px; padding:8px; color:#3a2a10; position:relative;
  }
  .cardCell.locked { filter:grayscale(1) brightness(.6); }
  .cardCell h4 { font-size:15px; display:flex; align-items:center; gap:5px; }
  .cardCell h4 .lvlTag { margin-left:auto; font-size:11px; background:#3a9e3a; color:#fff; border-radius:6px; padding:1px 6px; }
  .cardCell .bigIcon { font-size:34px; text-align:center; margin:2px 0; }
  .cardCell .stat { font-size:11px; line-height:1.5; }
  .cardCell .stat b { color:#7a4a08; }
  .cardCell .foot { display:flex; gap:6px; margin-top:6px; }
  .cardCell .foot .btn { flex:1; font-size:12px; padding:8px 4px; border-radius:8px; }
  .cardCell .lockInfo { font-size:11px; text-align:center; color:#ffd0a0; margin-top:6px; }
  .cardCell .indeck { position:absolute; top:-7px; left:-7px; background:#3a9e3a; color:#fff; font-size:10px; padding:2px 7px; border-radius:8px; border:2px solid #fff; }

  /* ---------- 战斗 HUD ---------- */
  #battle { z-index:3; }
  #bTop {
    position:absolute; top:calc(6px + env(safe-area-inset-top)); left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:center; gap:10px; pointer-events:none;
  }
  .crownBox {
    background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.35); border-radius:10px;
    color:#fff; font-size:17px; padding:3px 10px; font-weight:bold; min-width:64px; text-align:center;
  }
  .crownBox.me { border-color:#7ec8ff; }
  .crownBox.foe { border-color:#ff9a8a; }
  #timer {
    background:rgba(0,0,0,.6); color:#fff; font-weight:bold; font-size:17px;
    border-radius:10px; padding:4px 12px; border:2px solid rgba(255,255,255,.35);
  }
  #leaveBtn {
    position:absolute; top:calc(8px + env(safe-area-inset-top)); right:8px; z-index:7;
    pointer-events:auto; font-size:12px; padding:6px 10px;
  }
  #fpsTag { position:absolute; left:6px; bottom:96px; z-index:6; color:rgba(255,255,255,.55); font-size:10px; pointer-events:none; }

  #bBottom {
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    padding:6px 8px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 30%);
  }
  #elixirBar { height:14px; background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.4); border-radius:8px; overflow:hidden; position:relative; margin-bottom:6px; }
  #elixirFill { height:100%; width:0%; background:linear-gradient(#ff7be0,#c84dd8); border-radius:6px; }
  #elixirNum { position:absolute; inset:0; text-align:center; font-size:10px; color:#fff; font-weight:bold; line-height:11px; text-shadow:1px 1px 0 #000; }
  #hand { display:flex; gap:7px; justify-content:center; }
  .bcard {
    width:76px; border-radius:10px; border:3px solid #8a6d3c; background:linear-gradient(170deg,#f4ecd8,#d0b98a);
    text-align:center; color:#3a2a10; position:relative; padding:3px 0 4px; touch-action:none;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  .bcard .bicon { font-size:26px; line-height:30px; }
  .bcard .bname { font-size:10px; font-weight:bold; }
  .bcard .bcost {
    position:absolute; left:-5px; top:-5px; width:22px; height:22px; border-radius:50%;
    background:#2b78d4; border:2px solid #fff; color:#fff; font-weight:bold; font-size:12px; line-height:18px;
  }
  .bcard.noelixir { filter:grayscale(.85) brightness(.72); }
  .bcard.armed { border-color:#fff; box-shadow:0 0 10px 3px #ffe080, 0 3px 0 rgba(0,0,0,.4); }
  .bcard.dragging { opacity:.45; }

  /* ---------- 结算 / 弹窗 ---------- */
  .modal {
    position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center;
  }
  .modal.show { display:flex; }
  .panel {
    width:360px; background:linear-gradient(#f4ecd8,#dcc9a0); border:4px solid #7a5a24;
    border-radius:18px; padding:22px; text-align:center; color:#3a2a10;
  }
  .panel h2 { font-size:28px; margin-bottom:10px; }
  .panel .sub { font-size:14px; line-height:1.9; margin-bottom:14px; }
  .rewardRow { display:flex; justify-content:center; gap:14px; margin:10px 0 16px; font-size:14px; }
  .rewardRow div { background:rgba(0,0,0,.08); border-radius:10px; padding:8px 12px; min-width:80px; }
  .rewardRow b { display:block; font-size:18px; margin-top:2px; }

  /* 新手引导 */
  #tut { z-index:30; }
  .tutPanel {
    width:330px; background:rgba(10,20,10,.92); border:3px solid #9aff9a; border-radius:16px;
    color:#fff; padding:20px; text-align:center;
  }
  .tutPanel .tutIcon { font-size:40px; }
  .tutPanel h3 { margin:6px 0; font-size:20px; color:#ffe980; }
  .tutPanel p { font-size:14px; line-height:1.8; margin-bottom:14px; }
  .tutDots { margin-bottom:10px; font-size:12px; color:#9aff9a; }

  #rotateHint {
    position:absolute; top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:4px 10px; border-radius:12px; z-index:8;
    display:none; pointer-events:none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="450" height="800"></canvas>

  <!-- 主界面 -->
  <div class="screen show" id="home">
    <div class="topbar">
      <div class="pill">👑 奖杯<b id="hTrophy">0</b></div>
      <div class="pill">💰 金币<b id="hGold">0</b></div>
      <div class="pill">🏰 国王等级<b id="hKing">1</b></div>
    </div>
    <div class="logo">
      <h1>皇室奇兵</h1>
      <p>竖屏即时策略 · 推塔对战</p>
    </div>
    <div class="deckArea">
      <h3>我的出战卡组（8 张）</h3>
      <div class="deckRow" id="hDeck"></div>
    </div>
    <div class="mainBtns">
      <button class="btn btn-primary" id="btnBattle" style="font-size:24px;padding:17px;">⚔️ 开 始 对 战</button>
      <div class="topbtns">
        <button class="btn btn-blue" id="btnColl">🃏 卡牌收集</button>
        <button class="btn btn-grey" id="btnTut">📖 新手教程</button>
        <button class="btn btn-grey" id="btnMute">🔊</button>
      </div>
    </div>
  </div>

  <!-- 卡牌收集 -->
  <div class="screen" id="collection">
    <div class="collHead">
      <button class="btn btn-grey back" id="collBack">‹</button>
      <h2>🃏 卡牌收集与升级</h2>
    </div>
    <div class="cardGrid" id="cardGrid"></div>
  </div>

  <!-- 战斗层 -->
  <div class="screen" id="battle">
    <div id="bTop">
      <div class="crownBox foe" id="crownFoe">🏰 0</div>
      <div id="timer">3:00</div>
      <div class="crownBox me" id="crownMe">🏰 0</div>
    </div>
    <button class="btn btn-grey" id="leaveBtn">撤离</button>
    <div id="fpsTag"></div>
    <div id="bBottom">
      <div id="elixirBar"><div id="elixirFill"></div><div id="elixirNum">5 / 10</div></div>
      <div id="hand"></div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="modal" id="resultModal">
    <div class="panel">
      <h2 id="resTitle">胜利！</h2>
      <div class="sub" id="resSub"></div>
      <div class="rewardRow" id="resRewards"></div>
      <button class="btn btn-primary" id="resBtn">领取奖励</button>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="modal" id="tut">
    <div class="tutPanel">
      <div class="tutIcon" id="tutIcon">💧</div>
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <div class="tutDots" id="tutDots"></div>
      <button class="btn btn-gold" id="tutNext">下一步</button>
    </div>
  </div>

  <div id="rotateHint">竖屏体验更佳 📱</div>
</div>

<script>
"use strict";
/* 注意：为兼容 Android 8 / iOS 12 较旧 WebView，不使用可选链(?.)与空值合并(??) */

/* ============================ 常量 ============================ */
var W = 450, H = 800;
var RIVER_TOP = 370, RIVER_BOT = 430, MID = 400;
var BRIDGE_L = 105, BRIDGE_R = 345, BRIDGE_HALF = 36;
var MATCH_TIME = 180, OT_TIME = 60;
var REGROW = 2.8, REGROW_OT = 1.4, MAX_ELIXIR = 10;
var SAVE_KEY = "royals_save_v1";

/* 卡牌图鉴（1级数值） */
var CARDS = {
  knight   : { name:"骑士",     cost:4, icon:"🤺", hp:760,  dmg:82,  range:26,  spd:62,  atks:1.1 },
  archers  : { name:"弓箭手",   cost:3, icon:"🏹", hp:125,  dmg:42,  range:150, spd:78,  atks:1.1, count:2, proj:"arrow" },
  giant    : { name:"巨人",     cost:5, icon:"🧌", hp:2200, dmg:140, range:28,  spd:45,  atks:1.5, buildingOnly:true },
  goblins  : { name:"哥布林",   cost:2, icon:"👺", hp:95,   dmg:34,  range:22,  spd:95,  atks:1.0, count:3 },
  musk     : { name:"火枪手",   cost:4, icon:"💂", hp:340,  dmg:115, range:160, spd:72,  atks:1.0, proj:"bolt", hitsAir:true },
  dragon   : { name:"飞龙宝宝", cost:4, icon:"🐉", hp:480,  dmg:70,  range:130, spd:82,  atks:1.5, count:1, air:true, proj:"fire", splash:38, hitsAir:true },
  pekka    : { name:"迷你皮卡", cost:4, icon:"🤖", hp:650,  dmg:260, range:28,  spd:82,  atks:1.6 },
  fireball : { name:"火球术",   cost:4, icon:"🔥", spell:true, dmg:340, radius:115 },
  minions  : { name:"亡灵",     cost:3, icon:"🦇", hp:85,   dmg:40,  range:24,  spd:100, atks:1.0, count:3, air:true, trophy:100 },
  skeletons: { name:"骷髅兵",   cost:1, icon:"💀", hp:50,   dmg:30,  range:22,  spd:100, atks:0.9, count:4, trophy:250 }
};
var STARTER_DECK = ["knight","archers","giant","goblins","musk","dragon","pekka","fireball"];
var ALL_CARD_IDS = ["knight","archers","giant","goblins","musk","dragon","pekka","fireball","minions","skeletons"];

/* ============================ 存档 ============================ */
function defaultSave() {
  var cards = {};
  for (var i = 0; i < STARTER_DECK.length; i++) cards[STARTER_DECK[i]] = { lvl:1, copies:0 };
  return {
    gold: 250, trophy: 0, wins: 0,
    cards: cards,
    deck: STARTER_DECK.slice(),
    tutorialDone: false, muted: false
  };
}
var save = defaultSave();
function loadSave() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && s.cards && s.deck && s.deck.length === 8) save = s;
  } catch (e) { /* 损坏则用默认档 */ }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function owns(id) { return !!save.cards[id] || save.trophy >= (CARDS[id].trophy || 0); }
function unlocked(id) { return save.trophy >= (CARDS[id].trophy || 0); }
function cardLvl(id) { return (save.cards[id] && save.cards[id].lvl) || 1; }
function lvlMult(lvl) { return 1 + 0.1 * (lvl - 1); }
function kingLevel() {
  var p = 0, id;
  for (id in save.cards) p += (save.cards[id].lvl - 1);
  return Math.min(10, 1 + Math.floor(p / 3));
}
function upgradeCost(lvl) { return { copies: lvl * 2, gold: 40 * lvl }; }

/* ============================ 音效（WebAudio 合成） ============================ */
var AudioSys = {
  ctx: null,
  ensure: function () {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  },
  tone: function (f, d, type, v, when) {
    if (save.muted || !this.ctx) return;
    var t = this.ctx.currentTime + (when || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v || .04, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + d);
  },
  deploy: function () { this.tone(330, .08, "square", .035); },
  hit: function () { this.tone(190, .05, "square", .018); },
  shoot: function () { this.tone(700, .05, "triangle", .02); },
  towerDown: function () { this.tone(160, .25, "sawtooth", .06); this.tone(90, .35, "sawtooth", .06, .12); },
  win: function () { [523,659,784,1047].forEach(function(f,i){ AudioSys.tone(f,.18,"square",.05,i*.15); }); },
  lose: function () { [420,330,240].forEach(function(f,i){ AudioSys.tone(f,.25,"sawtooth",.05,i*.2); }); }
};

/* ============================ 舞台自适应（固定逻辑分辨率，纯CSS缩放） ============================ */
var stage = document.getElementById("stage");
function fitStage() {
  var sw = window.innerWidth, sh = window.innerHeight;
  var s = Math.min(sw / W, sh / H);
  stage.style.transform = "scale(" + s + ")";
  var hint = document.getElementById("rotateHint");
  hint.style.display = (sw > sh && sw / sh > 1.25) ? "block" : "none";
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", function () { setTimeout(fitStage, 200); });
fitStage();

var cv = document.getElementById("cv"), ctx = cv.getContext("2d");

/* ============================ 界面路由 ============================ */
var $ = function (id) { return document.getElementById(id); };
function show(name) {
  var names = ["home","collection","battle"];
  for (var i = 0; i < names.length; i++) $(names[i]).classList.toggle("show", names[i] === name);
}
function refreshHome() {
  $("hTrophy").textContent = save.trophy;
  $("hGold").textContent = save.gold;
  $("hKing").textContent = kingLevel();
  var row = $("hDeck"), html = "";
  for (var i = 0; i < save.deck.length; i++) {
    var d = CARDS[save.deck[i]];
    html += '<div class="mini"><span class="lv">Lv' + cardLvl(save.deck[i]) + '</span>' +
            '<span class="ic">' + d.icon + '</span><span class="cost">' + d.cost + '💧</span></div>';
  }
  row.innerHTML = html;
  $("btnMute").textContent = save.muted ? "🔇" : "🔊";
}

function refreshCollection() {
  var grid = $("cardGrid"), html = "";
  for (var i = 0; i < ALL_CARD_IDS.length; i++) {
    var id = ALL_CARD_IDS[i], c = CARDS[id], lvl = cardLvl(id), m = lvlMult(lvl);
    var owned = owns(id), inDeck = save.deck.indexOf(id) >= 0;
    var info = save.cards[id] || { copies: 0 };
    var cost = upgradeCost(lvl);
    var maxed = lvl >= 10;
    var canUp = owned && !maxed && info.copies >= cost.copies && save.gold >= cost.gold;
    var statLine = c.spell
      ? '<div class="stat">伤害 <b>' + Math.round(c.dmg * m) + '</b> · 范围 <b>' + c.radius + '</b></div>'
      : '<div class="stat">生命 <b>' + Math.round(c.hp * m) + '</b> · 伤害 <b>' + Math.round(c.dmg * m) + '</b></div>' +
        '<div class="stat">费用 <b>' + c.cost + '💧</b>' + (c.air ? ' · <b>空军</b>' : '') + (c.buildingOnly ? ' · <b>只打建筑</b>' : '') + '</div>';
    html += '<div class="cardCell' + (owned ? '' : ' locked') + '">';
    if (inDeck) html += '<span class="indeck">出战中</span>';
    html += '<h4>' + c.icon + ' ' + c.name + '<span class="lvlTag">Lv' + lvl + '</span></h4>';
    html += '<div class="bigIcon">' + c.icon + '</div>' + statLine;
    if (!owned) {
      html += '<div class="lockInfo">🔒 ' + c.trophy + ' 奖杯解锁</div>';
    } else if (maxed) {
      html += '<div class="foot"><button class="btn btn-grey" disabled>已满级</button></div>';
    } else {
      html += '<div class="stat" style="margin-top:4px;">升级需：' + cost.copies + ' 张（持有 ' + info.copies + '）· ' + cost.gold + ' 金币</div>';
      html += '<div class="foot"><button class="btn btn-primary" data-up="' + id + '"' + (canUp ? '' : ' disabled') + '>升级</button>' +
              '<button class="btn ' + (inDeck ? 'btn-grey' : 'btn-blue') + '" data-deck="' + id + '">' + (inDeck ? '下阵' : '上阵') + '</button></div>';
    }
    html += '</div>';
  }
  grid.innerHTML = html;
}
$("cardGrid").addEventListener("click", function (e) {
  var up = e.target.getAttribute && e.target.getAttribute("data-up");
  var dk = e.target.getAttribute && e.target.getAttribute("data-deck");
  if (up) {
    var lvl = cardLvl(up), cost = upgradeCost(lvl), info = save.cards[up];
    if (lvl >= 10 || !info || info.copies < cost.copies || save.gold < cost.gold) return;
    info.copies -= cost.copies; save.gold -= cost.gold; info.lvl = lvl + 1;
    persist(); refreshCollection(); refreshHome();
    return;
  }
  if (dk) {
    var pos = save.deck.indexOf(dk);
    if (pos >= 0) {
      if (save.deck.length <= 8) { flash("卡组必须保持 8 张"); return; }
      save.deck.splice(pos, 1);
    } else {
      if (!owns(dk)) { flash("奖杯数不足，尚未解锁"); return; }
      if (save.deck.length >= 8) { flash("卡组已满 8 张，请先下阵其他卡"); return; }
      save.deck.push(dk);
    }
    persist(); refreshCollection(); refreshHome();
  }
});
function flash(msg) {
  var el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:absolute;left:50%;top:55%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:40;";
  stage.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1400);
}

$("btnColl").addEventListener("click", function () { refreshCollection(); show("collection"); });
$("collBack").addEventListener("click", function () { refreshHome(); show("home"); });
$("btnMute").addEventListener("click", function () { save.muted = !save.muted; persist(); refreshHome(); });
$("btnTut").addEventListener("click", function () { startTutorial(true); });

/* ============================ 战斗 ============================ */
var battle = null;
var uidSeq = 1;

function newBattle() {
  var kl = kingLevel();
  var foeLvl = Math.max(1, kl - 1);
  var b = {
    t: 0, state: "play", // play | over
    result: null,
    overtime: false,
    elixir: 5, foeElixir: 5,
    hand: [], queue: [],
    units: [], towers: [], projectiles: [], spells: [], fx: [],
    crownMe: 0, crownFoe: 0,
    aiTimer: 1.2, aiFrozen: !save.tutorialDone,
    kingScale: 1 + 0.06 * (kl - 1),
    foeLvl: foeLvl,
    placing: null, armed: null,
    cam: 0
  };
  // 卡组循环
  var deck = save.deck.slice();
  // 简单洗牌
  for (var k = deck.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var tmp = deck[k]; deck[k] = deck[j]; deck[j] = tmp; }
  b.hand = deck.slice(0, 4);
  b.queue = deck.slice(4);
  b.aiHand = deck.slice(0, 4); // AI 使用独立牌堆，避免污染玩家手牌
  b.aiQueue = deck.slice(4);

  // 塔
  var tHp1 = Math.round(1400 * b.kingScale), tHpK = Math.round(2400 * b.kingScale);
  var fHp1 = Math.round(1400 * (1 + 0.06 * (foeLvl - 1))), fHpK = Math.round(2400 * (1 + 0.06 * (foeLvl - 1)));
  b.towers = [
    mkTower("tpL", 1, 95, 648, tHp1, 200, 55, .8, false),
    mkTower("tpR", 1, 355, 648, tHp1, 200, 55, .8, false),
    mkTower("tk",  1, 225, 738, tHpK, 175, 70, 1.0, true),
    mkTower("fpL", -1, 95, 152, fHp1, 200, 55, .8, false),
    mkTower("fpR", -1, 355, 152, fHp1, 200, 55, .8, false),
    mkTower("fk",  -1, 225, 62, fHpK, 175, 70, 1.0, true)
  ];
  return b;
}
function mkTower(id, side, x, y, hp, range, dmg, atks, king) {
  return { kind:"tower", id:id, side:side, x:x, y:y, r: king?22:19, hp:hp, maxHp:hp,
           range:range, dmg:dmg, atks:atks, cd:0, king:king, alive:true, active: !king };
}

function spawnUnit(side, type, x, y, lvl) {
  var c = CARDS[type], m = lvlMult(lvl);
  var n = c.count || 1;
  var list = [];
  for (var i = 0; i < n; i++) {
    var ox = (i - (n - 1) / 2) * 20;
    var oy = (n > 1 && (i % 2 === 1)) ? 14 : 0;
    var u = {
      kind:"unit", uid: uidSeq++, side:side, type:type,
      x: x + ox, y: y + oy, r: c.air ? 13 : 14,
      hp: Math.round(c.hp * m), maxHp: Math.round(c.hp * m),
      speed: c.spd, dmg: Math.round(c.dmg * m), range: c.range,
      atks: c.atks, cd: .2 + Math.random() * .3,
      air: !!c.air, hitsAir: !!c.hitsAir || !!c.air,
      buildingOnly: !!c.buildingOnly, splash: c.splash || 0,
      proj: c.proj || null,
      bridge: x < W / 2 ? BRIDGE_L : BRIDGE_R,
      target: null, retarget: 0, walkT: Math.random() * 6,
      aimx: x, aimy: y + (side === 1 ? -1 : 1),
      atkP: 0, hurt: 0
    };
    battle.units.push(u);
    list.push(u);
  }
  spawnRing(x, y, side === 1 ? "#9ad0ff" : "#ffb0a0");
  return list;
}

function spawnRing(x, y, color) {
  battle.fx.push({ type:"ring", x:x, y:y, t:0, life:.35, color:color });
}
function spawnText(x, y, text, color) {
  battle.fx.push({ type:"text", x:x, y:y, t:0, life:.8, text:text, color:color || "#fff" });
}
function spawnBoom(x, y, r) {
  battle.fx.push({ type:"boom", x:x, y:y, t:0, life:.4, r:r });
}

/* ---------- 部署 ---------- */
function deployValid(side, x, y, isSpell) {
  if (x < 16 || x > W - 16 || y < 16 || y > H - 16) return false;
  if (isSpell) return true;
  // 河流：仅桥上（中立区域，不区分半场）可部署
  var onBridge = (Math.abs(x - BRIDGE_L) <= BRIDGE_HALF || Math.abs(x - BRIDGE_R) <= BRIDGE_HALF);
  var inBand = (y > RIVER_TOP - 6 && y < RIVER_BOT + 6);
  if (inBand && !onBridge) return false;
  if (!inBand) {
    if (side === 1) {
      // 敌方半场：摧毁任意敌方公主塔后才允许部署
      if (y < RIVER_TOP && !princessDown(-1)) return false;
    } else {
      if (y > RIVER_BOT && !princessDown(1)) return false;
    }
  }
  // 与建筑保持距离
  for (var i = 0; i < battle.towers.length; i++) {
    var tw = battle.towers[i];
    if (!tw.alive) continue;
    if (dist(x, y, tw.x, tw.y) < tw.r + 16) return false;
  }
  // 与已部署单位保持最小间距（允许一定重叠，避免完全堆叠）
  for (var j = 0; j < battle.units.length; j++) {
    var u = battle.units[j];
    if (dist(x, y, u.x, u.y) < 22) return false;
  }
  return true;
}
function princessDown(side) {
  var a = findTower(side, true);
  for (var i = 0; i < a.length; i++) if (!a[i].alive) return true;
  return false;
}
function findTower(side, wantPrincess) {
  // wantPrincess=true 返回两座公主塔；false 返回国王塔
  var out = [];
  for (var k = 0; k < battle.towers.length; k++) {
    var tw = battle.towers[k];
    if (tw.side === side && tw.king === !wantPrincess) out.push(tw);
  }
  return out;
}
function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }

function deployCard(side, cardId, x, y) {
  var c = CARDS[cardId];
  if (c.spell) {
    if (!deployValid(side, x, y, true)) return false;
    if (side === 1) { if (battle.elixir < c.cost) return false; battle.elixir -= c.cost; }
    battle.spells.push({ x:x, y:y, t:.55, side:side, dmg:Math.round(c.dmg * lvlMult(side === 1 ? cardLvl(cardId) : battle.foeLvl)), radius:c.radius });
    AudioSys.deploy();
    return true;
  }
  if (!deployValid(side, x, y, false)) return false;
  if (side === 1) { if (battle.elixir < c.cost) return false; battle.elixir -= c.cost; }
  var lvl = side === 1 ? cardLvl(cardId) : battle.foeLvl;
  spawnUnit(side, cardId, x, y, lvl);
  AudioSys.deploy();
  return true;
}

/* ---------- 目标选择 ---------- */
function acquireTarget(u) {
  var best = null, bd = 1e9;
  var i, t;
  if (!u.buildingOnly) {
    for (i = 0; i < battle.units.length; i++) {
      t = battle.units[i];
      if (t.side === u.side || t.hp <= 0) continue;
      if (t.air && !u.hitsAir) continue;
      var d = dist(u.x, u.y, t.x, t.y) - t.r;
      if (d < bd) { bd = d; best = t; }
    }
  }
  for (i = 0; i < battle.towers.length; i++) {
    t = battle.towers[i];
    if (t.side === u.side || !t.alive || !t.active) continue;
    var dd = dist(u.x, u.y, t.x, t.y) - t.r;
    if (u.buildingOnly) { if (dd < bd) { bd = dd; best = t; } }
    else if (!best && dd < bd) { bd = dd; best = t; }
  }
  return best;
}

function damageUnit(u, dmg) {
  u.hp -= dmg;
  u.hurt = .12;
  if (u.hp <= 0) {
    spawnText(u.x, u.y - 12, "✖", u.side === 1 ? "#9ad0ff" : "#ffb0a0");
  }
}
function damageTower(tw, dmg) {
  tw.hp -= dmg;
  spawnText(tw.x, tw.y - tw.r - 6, String(dmg), "#ffe980");
  if (tw.hp <= 0 && tw.alive) destroyTower(tw);
}
function destroyTower(tw) {
  tw.alive = false; tw.active = false; tw.hp = 0;
  spawnBoom(tw.x, tw.y, 40);
  AudioSys.towerDown();
  if (tw.side === -1) battle.crownMe++; else battle.crownFoe++;
  // 公主塔被毁 → 激活同方国王塔；敌方公主塔被毁 → 玩家可全屏部署（部署判定中实时读）
  var same = findTower(tw.side, false);
  for (var i = 0; i < same.length; i++) {
    if (same[i].king) same[i].active = true;
  }
  var king = null;
  for (var k = 0; k < battle.towers.length; k++) if (battle.towers[k].side === tw.side && battle.towers[k].king) king = battle.towers[k];
  if (king) king.active = true;
  if (tw.king) endMatch(tw.side === -1 ? "win" : "lose");
  else if (battle.overtime) endMatch(battle.crownMe > battle.crownFoe ? "win" : (battle.crownMe < battle.crownFoe ? "lose" : "draw"));
}

function applyHit(x, y, dmg, side, splash, hitsAir) {
  if (splash > 0) {
    for (var i = 0; i < battle.units.length; i++) {
      var u = battle.units[i];
      if (u.side === side || u.hp <= 0) continue;
      if (u.air && !hitsAir) continue;
      if (dist(x, y, u.x, u.y) <= splash + u.r) damageUnit(u, dmg);
    }
    for (var k = 0; k < battle.towers.length; k++) {
      var tw = battle.towers[k];
      if (tw.side === side || !tw.alive || !tw.active) continue;
      if (dist(x, y, tw.x, tw.y) <= splash + tw.r) damageTower(tw, Math.round(dmg * .6));
    }
    spawnBoom(x, y, splash);
  }
}

/* ---------- 主更新 ---------- */
function update(dt) {
  if (!battle || battle.state !== "play") { updateFx(dt); return; }
  var b = battle;
  b.t += dt;

  // 圣水
  var regen = b.overtime ? REGROW_OT : REGROW;
  b.elixir = Math.min(MAX_ELIXIR, b.elixir + dt / regen);
  b.foeElixir = Math.min(MAX_ELIXIR, b.foeElixir + dt / regen);

  // 计时 / 加时
  if (!b.overtime && b.t >= MATCH_TIME) {
    if (b.crownMe === b.crownFoe) {
      b.overtime = true; b.t = 0;
      flash("加时赛 · 圣水翻倍");
    } else {
      endMatch(b.crownMe > b.crownFoe ? "win" : "lose");
    }
  } else if (b.overtime && b.t >= OT_TIME) {
    endMatch(b.crownMe > b.crownFoe ? "win" : (b.crownMe < b.crownFoe ? "lose" : "draw"));
  }

  updateAI(dt);
  updateUnits(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateSpells(dt);
  updateFx(dt);
}

function updateUnits(dt) {
  var b = battle, i;
  for (i = 0; i < b.units.length; i++) {
    var u = b.units[i];
    if (u.hp <= 0) continue;
    u.walkT += dt * 6;
    u.retarget -= dt; u.cd -= dt;
    u.atkP = Math.max(0, u.atkP - dt * 5.5);
    u.hurt = Math.max(0, u.hurt - dt);
    if (!u.target || u.target.hp <= 0 || (u.target.kind === "tower" && !u.target.alive) || u.retarget <= 0) {
      u.target = acquireTarget(u);
      u.retarget = .2;
    }
    var gx = u.x, gy = u.side === 1 ? 62 : 738;
    if (u.target) { gx = u.target.x; gy = u.target.y; }
    u.aimx = gx; u.aimy = gy; // 面朝当前目标/行军方向（供绘制）

    // 地面部队过桥寻路：在河岸带内先横移到桥
    if (!u.air) {
      var goalSide = gy < MID ? -1 : 1;
      var mySide = u.y < MID ? -1 : 1;
      if (goalSide !== mySide && Math.abs(u.y - MID) < 78 && Math.abs(u.x - u.bridge) > 22) {
        gx = u.bridge; gy = u.y;
      }
    }

    var dx = gx - u.x, dy = gy - u.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var reach = u.range + (u.target ? u.target.r : 0) + 3;
    if (u.target && d <= reach) {
      // 攻击
      if (u.cd <= 0) {
        u.cd = u.atks;
        u.atkP = 1; // 攻击动作相位（绘制挥砍/前刺）
        if (u.proj) {
          b.projectiles.push({
            x:u.x, y:u.y - 6, target:u.target, tx:u.target.x, ty:u.target.y,
            speed: u.proj === "fire" ? 320 : 430,
            dmg:u.dmg, side:u.side, splash:u.splash, hitsAir:u.hitsAir,
            kind:u.proj
          });
          AudioSys.shoot();
        } else {
          if (u.target.kind === "tower") damageTower(u.target, u.dmg);
          else damageUnit(u.target, u.dmg);
          spawnSlash(u.target.x, u.target.y - 10);
          AudioSys.hit();
        }
      }
    } else if (d > 0.01) {
      u.x += dx / d * u.speed * dt;
      u.y += dy / d * u.speed * dt;
    }
  }
  b.units = b.units.filter(function (u) { return u.hp > 0; });
}

function spawnSlash(x, y) {
  battle.fx.push({ type:"slash", x:x, y:y, t:0, life:.14 });
}

function updateTowers(dt) {
  var b = battle, i;
  for (i = 0; i < b.towers.length; i++) {
    var tw = b.towers[i];
    if (!tw.alive || !tw.active) continue;
    tw.cd -= dt;
    if (tw.cd > 0) continue;
    // 最近敌方单位（塔可对空）
    var best = null, bd = tw.range;
    for (var k = 0; k < b.units.length; k++) {
      var u = b.units[k];
      if (u.side === tw.side || u.hp <= 0) continue;
      var d = dist(tw.x, tw.y, u.x, u.y) - u.r;
      if (d < bd) { bd = d; best = u; }
    }
    if (best) {
      tw.cd = tw.atks;
      b.projectiles.push({
        x:tw.x, y:tw.y - 14, target:best, tx:best.x, ty:best.y,
        speed:540, dmg:tw.dmg, side:tw.side, splash:0, hitsAir:true, kind:"bolt"
      });
    }
  }
}

function updateProjectiles(dt) {
  var b = battle, i;
  for (i = 0; i < b.projectiles.length; i++) {
    var p = b.projectiles[i];
    var alive = p.target && ((p.target.kind === "unit" && p.target.hp > 0) || (p.target.kind === "tower" && p.target.alive));
    if (alive) { p.tx = p.target.x; p.ty = p.target.y; }
    var dx = p.tx - p.x, dy = p.ty - p.y, d = Math.sqrt(dx * dx + dy * dy);
    var step = p.speed * dt;
    if (d <= step + 4) {
      // 命中
      if (p.splash > 0) {
        applyHit(p.tx, p.ty, p.dmg, p.side, p.splash, p.hitsAir);
      } else if (alive) {
        if (p.target.kind === "tower") damageTower(p.target, p.dmg);
        else damageUnit(p.target, p.dmg);
      }
      p.dead = true;
    } else {
      p.x += dx / d * step;
      p.y += dy / d * step;
    }
  }
  b.projectiles = b.projectiles.filter(function (p) { return !p.dead; });
}

function updateSpells(dt) {
  var b = battle, i;
  for (i = 0; i < b.spells.length; i++) {
    var s = b.spells[i];
    s.t -= dt;
    if (s.t <= 0) {
      applyHit(s.x, s.y, s.dmg, s.side, s.radius, true);
      AudioSys.towerDown();
      s.dead = true;
    }
  }
  b.spells = b.spells.filter(function (s) { return !s.dead; });
}

function updateFx(dt) {
  if (!battle) return;
  for (var i = 0; i < battle.fx.length; i++) battle.fx[i].t += dt;
  battle.fx = battle.fx.filter(function (f) { return f.t < f.life; });
}

/* ---------- 敌方 AI ---------- */
function updateAI(dt) {
  var b = battle;
  if (b.aiFrozen) return;
  b.aiTimer -= dt;
  if (b.aiTimer > 0) return;
  b.aiTimer = 2.0 + Math.random() * 1.8;

  // 从 AI 自己的手牌中挑选可承担的卡
  var affordable = [];
  for (var i = 0; i < b.aiHand.length; i++) {
    var id = b.aiHand[i];
    if (CARDS[id].cost <= b.foeElixir) affordable.push(id);
  }
  if (!affordable.length) return;
  var pick = affordable[Math.floor(Math.random() * affordable.length)];
  var lane = Math.random() < .5 ? BRIDGE_L : BRIDGE_R;
  var push = Math.random() < .45; // 激进：压河边；保守：后场下兵
  var x = lane + (Math.random() * 50 - 25);
  var y = push ? 250 + Math.random() * 50 : 290 + Math.random() * 60;
  if (deployCard(-1, pick, x, y)) {
    b.foeElixir -= CARDS[pick].cost;
    var idx = b.aiHand.indexOf(pick);
    b.aiHand[idx] = b.aiQueue.shift();
    b.aiQueue.push(pick);
  }
}

function endMatch(r) {
  if (battle.state === "over") return;
  battle.state = "over"; battle.result = r;
  // 结算奖励
  var reward = { gold:0, cards:[], trophy:0, wins:0 };
  if (r === "win") {
    reward.gold = 50 + Math.floor(Math.random() * 21);
    reward.trophy = 30; reward.wins = 1;
    for (var i = 0; i < 3; i++) reward.cards.push(randomRewardCard());
    AudioSys.win();
  } else if (r === "lose") {
    reward.gold = 12; reward.trophy = -12;
    reward.cards.push(randomRewardCard());
    AudioSys.lose();
  } else {
    reward.gold = 25;
  }
  save.gold += reward.gold;
  save.trophy = Math.max(0, save.trophy + reward.trophy);
  save.wins += reward.wins;
  for (var k = 0; k < reward.cards.length; k++) {
    var id = reward.cards[k];
    if (!save.cards[id]) save.cards[id] = { lvl:1, copies:0 };
    save.cards[id].copies++;
  }
  persist();
  pendingReward = reward;
  resultTimer = setTimeout(showResult, 900);
}
function randomRewardCard() {
  var pool = STARTER_DECK.slice();
  if (save.trophy >= 100) pool.push("minions");
  if (save.trophy >= 250) pool.push("skeletons");
  return pool[Math.floor(Math.random() * pool.length)];
}
var pendingReward = null;
var resultTimer = 0;
/* 统一离场：取消待弹结算、关面板、清战场、刷新主界面 */
function quitToHome() {
  clearTimeout(resultTimer);
  pendingReward = null;
  $("resultModal").classList.remove("show");
  battle = null;
  refreshHome();
  show("home");
}
function showResult() {
  if (!battle) return; // 已在结算窗口期撤离，定时器作废
  var r = battle.result, rw = pendingReward || { gold:0, cards:[], trophy:0 };
  var title = $("resTitle");
  title.textContent = r === "win" ? "🏆 胜利！" : (r === "lose" ? "💀 战败" : "🤝 平局");
  title.style.color = r === "win" ? "#2e7d32" : (r === "lose" ? "#b02020" : "#555");
  $("resSub").innerHTML = "摧毁塔数 " + battle.crownMe + " : " + battle.crownFoe +
    "<br>累计胜场 " + save.wins + " · 当前奖杯 " + save.trophy;
  var html = '<div>💰 金币<b>+' + rw.gold + '</b></div>';
  html += '<div>👑 奖杯<b style="color:' + (rw.trophy >= 0 ? "#2e7d32" : "#b02020") + '">' + (rw.trophy >= 0 ? "+" : "") + rw.trophy + '</b></div>';
  if (rw.cards.length) {
    var names = "";
    for (var i = 0; i < rw.cards.length; i++) names += CARDS[rw.cards[i]].icon;
    html += '<div>🃏 卡牌<b>' + names + '</b></div>';
  }
  $("resRewards").innerHTML = html;
  $("resultModal").classList.add("show");
}
$("resBtn").addEventListener("click", quitToHome);

$("leaveBtn").addEventListener("click", function () {
  if (!battle) { show("home"); return; }
  // 结束后的 900ms 结算延迟窗口内撤离：直接离场（奖励已在 endMatch 结算）
  if (battle.state === "over") { quitToHome(); return; }
  if (window.confirm("中途撤离将判定为战败，确定离开吗？")) {
    battle.crownFoe = 3;
    endMatch("lose");
  }
});

/* ============================ 战斗渲染 ============================ */
function render() {
  ctx.clearRect(0, 0, W, H);
  drawField();
  if (!battle) return;
  drawTowers();
  drawSpells();
  // 按 y 排序绘制，层次自然
  var all = battle.units.slice().sort(function (a, b) { return a.y - b.y; });
  for (var i = 0; i < all.length; i++) drawUnit(all[i]);
  drawProjectiles();
  drawFx();
  drawPlacement();
}

function drawField() {
  // 敌方半场（深）与己方半场（浅）条纹
  var stripeColors1 = ["#3f8f3a","#378333"];
  var stripeColors2 = ["#4da046","#449440"];
  for (var r = 0; r < 24; r++) {
    var y0 = RIVER_BOT + r * 16, y1;
    if (y0 >= H) break;
    ctx.fillStyle = stripeColors2[r % 2];
    ctx.fillRect(0, y0, W, 16);
  }
  for (var rr = 0; rr < 24; rr++) {
    var yy = rr * 16;
    if (yy >= RIVER_TOP) break;
    ctx.fillStyle = stripeColors1[rr % 2];
    ctx.fillRect(0, yy, W, 16);
  }
  // 河道
  var g = ctx.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  g.addColorStop(0, "#3f8fd6"); g.addColorStop(.5, "#5aa8e8"); g.addColorStop(1, "#2f6fb0");
  ctx.fillStyle = g;
  ctx.fillRect(0, RIVER_TOP, W, RIVER_BOT - RIVER_TOP);
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
  var wave = (battle && battle.t ? battle.t : 0) * 30;
  ctx.beginPath();
  for (var x = 0; x <= W; x += 12) {
    var wy = MID + Math.sin((x + wave) / 26) * 5;
    if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
  }
  ctx.stroke();
  // 桥
  drawBridge(BRIDGE_L); drawBridge(BRIDGE_R);
  // 基地中线提示
  if (battle && (battle.placing || battle.armed)) {
    var spell = battle.placing ? CARDS[battle.placing.id].spell : CARDS[battle.armed].spell;
    if (!spell) {
      ctx.fillStyle = princessDown(-1) ? "rgba(255,240,150,.10)" : "rgba(180,255,180,.14)";
      ctx.fillRect(0, princessDown(-1) ? 0 : RIVER_BOT, W, princessDown(-1) ? H : H - RIVER_BOT);
    }
  }
}
function drawBridge(cx) {
  ctx.fillStyle = "#8a5a2c";
  ctx.fillRect(cx - BRIDGE_HALF, RIVER_TOP - 4, BRIDGE_HALF * 2, RIVER_BOT - RIVER_TOP + 8);
  ctx.fillStyle = "#6e431e";
  for (var y = RIVER_TOP; y < RIVER_BOT; y += 12) ctx.fillRect(cx - BRIDGE_HALF, y, BRIDGE_HALF * 2, 3);
  ctx.fillStyle = "#a87540";
  ctx.fillRect(cx - BRIDGE_HALF, RIVER_TOP - 4, BRIDGE_HALF * 2, 4);
  ctx.fillRect(cx - BRIDGE_HALF, RIVER_BOT, BRIDGE_HALF * 2, 4);
}

function drawTowers() {
  for (var i = 0; i < battle.towers.length; i++) {
    var t = battle.towers[i];
    var x = t.x, y = t.y;
    if (!t.alive) {
      // 废墟
      ctx.fillStyle = "rgba(60,60,60,.55)";
      ctx.beginPath(); ctx.ellipse(x, y + 8, t.r + 6, 10, 0, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    var team = t.side === 1 ? "#4a90e2" : "#e0554a";
    var dark = t.side === 1 ? "#2b5d9c" : "#a03028";
    // 阴影
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.ellipse(x, y + t.r + 4, t.r + 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    // 塔身
    ctx.fillStyle = dark;
    ctx.fillRect(x - t.r, y - t.r + 4, t.r * 2, t.r * 2 - 2);
    ctx.fillStyle = team;
    ctx.fillRect(x - t.r + 3, y - t.r + 2, t.r * 2 - 6, t.r * 2 - 6);
    // 城垛
    ctx.fillStyle = dark;
    for (var c = -1; c <= 1; c++) ctx.fillRect(x + c * 10 - 3, y - t.r - 3, 7, 7);
    // 国王皇冠/窗
    ctx.font = t.king ? "17px serif" : "12px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(t.king ? "👑" : "♟", x, y + 1);
    if (!t.active && t.king) { ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x - t.r, y - t.r, t.r * 2, t.r * 2); }
    // 血条
    if (t.hp < t.maxHp) {
      var bw = t.r * 2 + 4, ratio = Math.max(0, t.hp / t.maxHp);
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x - bw / 2, y - t.r - 12, bw, 5);
      ctx.fillStyle = ratio > .4 ? "#7dd65a" : "#e05040";
      ctx.fillRect(x - bw / 2, y - t.r - 12, bw * ratio, 5);
    }
  }
}

/* ---------- 兵种造型辅助 ---------- */
/* 视觉尺寸（仅绘制缩放，不改变碰撞半径与玩法） */
var UNIT_VIS = { knight:1.05, archers:.95, giant:1.42, goblins:.82, musk:1.0, dragon:1.22, pekka:1.12, minions:.85, skeletons:.8 };
function drCircle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function drEllipse(x, y, rx, ry, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function drRR(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}
function drTri(x1, y1, x2, y2, x3, y3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
}

function drawUnit(u) {
  var x = u.x, y = u.y;
  var vs = UNIT_VIS[u.type] || 1;
  var S = u.r * vs;
  var team = u.side === 1 ? "#4a90e2" : "#e0554a";
  var teamDk = u.side === 1 ? "#2f6fb3" : "#b03d2e";
  var fy = u.side === 1 ? -1 : 1;           // 前方（玩家向上，敌方向下）
  var mir = (u.aimx - x) >= 0 ? 1 : -1;     // 左右镜像
  var atk = u.atkP;
  var walk = Math.sin(u.walkT), flap = Math.sin(u.walkT * 1.35);
  var leg = atk > .35 ? 0 : walk * S * .14; // 走路摆腿
  var bob = u.air ? flap * 1.6 - 7 : Math.abs(walk) * 1.4;
  var cy = y - bob;

  /* 地面阴影（空军投影落在地面） */
  ctx.fillStyle = "rgba(0,0,0,.22)";
  drEllipse(x, y + S * .78 + 3 + (u.air ? 9 : 0), S * .8, 5.5);

  /* 阵营脚环 */
  ctx.strokeStyle = teamDk; ctx.lineWidth = 2; ctx.globalAlpha = .9;
  ctx.beginPath();
  ctx.ellipse(x, y + S * .82, S * .82, S * .26, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (u.type === "knight") {
    ctx.fillStyle = "#59626e";
    drEllipse(x - S * .26, cy + S * .62 + leg, S * .15, S * .21);
    drEllipse(x + S * .26, cy + S * .62 - leg, S * .15, S * .21);
    ctx.fillStyle = "#c9a24a"; drCircle(x - mir * S * .62, cy + S * .02, S * .27); // 盾
    ctx.fillStyle = team;      drCircle(x - mir * S * .62, cy + S * .02, S * .18);
    ctx.fillStyle = "#b9c4cf"; drRR(x - S * .42, cy - S * .28, S * .84, S * .72, S * .15); // 甲
    ctx.fillStyle = team; ctx.fillRect(x - S * .07, cy - S * .22, S * .14, S * .5);
    ctx.fillStyle = "#8c97a4"; drCircle(x - S * .42, cy - S * .22, S * .16);                 // 肩甲
    drCircle(x + S * .42, cy - S * .22, S * .16);
    ctx.fillStyle = "#98a3b0"; drCircle(x, cy - S * .62, S * .33);                            // 头盔
    ctx.fillStyle = "#2c333d"; ctx.fillRect(x - S * .2, cy - S * .58, S * .4, S * .08);       // 面缝
    ctx.fillStyle = team;                                                                     // 羽冠
    drTri(x, cy - S * 1.0, x - S * .1, cy - S * .66, x + S * .1, cy - S * .66);
    var sx = x + mir * S * .42, sy = cy - S * .05, sl = S * (.62 + atk * .5);
    ctx.strokeStyle = "#6a4f2c"; ctx.lineWidth = 3;                                           // 剑柄
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + fy * S * .16); ctx.stroke();
    ctx.strokeStyle = "#e6ecf2"; ctx.lineWidth = 2.6;                                         // 剑刃（朝向进攻前方）
    ctx.beginPath(); ctx.moveTo(sx, sy + fy * S * .18); ctx.lineTo(sx, sy + fy * sl); ctx.stroke();
    if (atk > .2) { ctx.globalAlpha = atk; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy + fy * S * .2); ctx.lineTo(sx, sy + fy * sl); ctx.stroke();
      ctx.globalAlpha = 1; }
  } else if (u.type === "archers") {
    ctx.fillStyle = "#5d4528";
    drEllipse(x - S * .2, cy + S * .62 + leg, S * .12, S * .19);
    drEllipse(x + S * .2, cy + S * .62 - leg, S * .12, S * .19);
    ctx.fillStyle = "#4d7d39"; drRR(x - S * .34, cy - S * .3, S * .68, S * .68, S * .13); // 绿衣
    ctx.fillStyle = "#7a5a32"; ctx.fillRect(x - mir * S * .44, cy - S * .55, S * .13, S * .42); // 箭袋
    ctx.fillStyle = "#d8d8d8"; drTri(x - mir * S * .44, cy - S * .55, x - mir * S * .31, cy - S * .55, x - mir * S * .38, cy - S * .7);
    ctx.fillStyle = "#f0c89a"; drCircle(x, cy - S * .6, S * .3);                           // 脸
    ctx.fillStyle = team;                                                                  // 头巾
    ctx.beginPath(); ctx.arc(x, cy - S * .62, S * .3, Math.PI, Math.PI * 2); ctx.fill();
    drTri(x - mir * S * .2, cy - S * .7, x - mir * S * .5, cy - S * .78, x - mir * S * .24, cy - S * .6);
    ctx.fillStyle = "#2c2418"; drCircle(x + mir * S * .1, cy - S * .62, S * .045);
    var bx = x + mir * S * .5, by = cy - S * .08;                                         // 弓
    ctx.strokeStyle = "#8a5a2c"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(bx, by - S * .4);
    ctx.quadraticCurveTo(bx + fy * S * .22, by, bx, by + S * .4); ctx.stroke();
    ctx.strokeStyle = "#e8e0cc"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, by - S * .38);
    ctx.lineTo(bx, by + fy * atk * S * .15);

  } else if (u.type === "giant") {

    drEllipse(x - S * .3, cy + S * .82 + leg, S * .26, S * .16);
    drEllipse(x + S * .3, cy + S * .82 - leg, S * .26, S * .16);
    ctx.fillStyle = "#8a6a42";
    drRR(x - S * .44, cy + S * .18, S * .3, S * .52, S * .1);
    drRR(x + S * .14, cy + S * .18, S * .3, S * .52, S * .1);
    ctx.fillStyle = "#e2b277";                                                                     // 手臂
    drCircle(x - S * .56, cy + S * .12, S * .2);
    drCircle(x + S * .56, cy + S * .12 + fy * punch, S * .2);
    ctx.fillStyle = "#cf9c5c";                                                                     // 垂下的大拳头
    drCircle(x - S * .56, cy + S * .42, S * .27);
    drCircle(x + S * .56, cy + S * .42 + fy * punch, S * .27);
    ctx.fillStyle = "#e2b277"; drRR(x - S * .52, cy - S * .36, S * 1.04, S * .8, S * .2);         // 躯干
    ctx.fillStyle = "#7a5a32"; ctx.fillRect(x - S * .2, cy - S * .3, S * .1, S * .55);            // 背带
    ctx.fillRect(x + S * .1, cy - S * .3, S * .1, S * .55);
    ctx.fillStyle = "#e8bd84"; drCircle(x, cy - S * .6, S * .38);                                  // 头
    ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 2.4;                                             // 怒眉
    ctx.beginPath(); ctx.moveTo(x - S * .2, cy - S * .72); ctx.lineTo(x - S * .05, cy - S * .66);
    ctx.moveTo(x + S * .2, cy - S * .72); ctx.lineTo(x + S * .05, cy - S * .66); ctx.stroke();
    ctx.fillStyle = "#2a1c10"; drCircle(x - S * .12, cy - S * .6, S * .05); drCircle(x + S * .12, cy - S * .6, S * .05);
  } else if (u.type === "goblins") {
    ctx.fillStyle = "#4f8a2f";
    drEllipse(x - S * .2, cy + S * .7 + leg, S * .13, S * .1);
    drEllipse(x + S * .2, cy + S * .7 - leg, S * .13, S * .1);
    ctx.fillStyle = "#69b93f"; drCircle(x, cy + S * .05, S * .42);
    ctx.fillStyle = "#7a5a32"; drTri(x - S * .2, cy + S * .3, x + S * .2, cy + S * .3, x, cy + S * .5); // 腰布
    drCircle(x, cy - S * .48, S * .36);                                                                 // 头
    ctx.fillStyle = "#55a536";                                                                          // 尖耳
    drTri(x - S * .28, cy - S * .55, x - S * .48, cy - S * .75, x - S * .22, cy - S * .7);
    drTri(x + S * .28, cy - S * .55, x + S * .48, cy - S * .75, x + S * .22, cy - S * .7);
    ctx.fillStyle = "#d83828"; drCircle(x - S * .12, cy - S * .5, S * .07); drCircle(x + S * .12, cy - S * .5, S * .07);
    var dx2 = x + mir * S * .34, dy2 = cy + S * .05, dl = S * (.3 + atk * .28);                        // 匕首
    ctx.strokeStyle = "#6a4f2c"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(dx2, dy2); ctx.lineTo(dx2, dy2 + fy * S * .12); ctx.stroke();
    ctx.strokeStyle = "#d2d8de"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dx2, dy2 + fy * S * .12); ctx.lineTo(dx2, dy2 + fy * dl); ctx.stroke();
  } else if (u.type === "musk") {
    ctx.fillStyle = "#2c3a5e";
    drEllipse(x - S * .22, cy + S * .62 + leg, S * .13, S * .2);
    drEllipse(x + S * .22, cy + S * .62 - leg, S * .13, S * .2);
    ctx.fillStyle = "#34508c"; drRR(x - S * .36, cy - S * .3, S * .72, S * .7, S * .13);   // 蓝军服
    ctx.fillStyle = "#e8e8ec"; ctx.fillRect(x - S * .34, cy + S * .02, S * .68, S * .06);   // 白色武装带
    ctx.fillStyle = "#f0c89a"; drCircle(x, cy - S * .58, S * .27);                          // 脸
    ctx.fillStyle = "#6a4a32";                                                              // 胡子
    ctx.beginPath(); ctx.arc(x, cy - S * .5, S * .2, .15, Math.PI - .15); ctx.fill();

    ctx.fillStyle = team; ctx.fillRect(x - S * .06, cy - S * .9, S * .12, S * .1);
    ctx.fillStyle = "#20242c"; drCircle(x - S * .1, cy - S * .58, S * .04);                // 眼
    var gx = x + mir * S * .18, gl = S * (.95 + atk * .25);                                // 火枪
    ctx.fillStyle = "#6a4a2c"; drRR(gx - S * .09, cy - S * .1, S * .18, S * .18, S * .04); // 木托
    ctx.fillStyle = "#333844"; ctx.fillRect(gx - S * .05, cy - S * .1 + fy * gl, S * .1, gl);
    ctx.fillStyle = "#1c2028"; drCircle(gx, cy - S * .1 + fy * gl, S * .08);
    if (atk > .6) { ctx.globalAlpha = (atk - .6) * 2.4; ctx.fillStyle = "#ffd760";

  } else if (u.type === "pekka") {
    ctx.fillStyle = "#46335f";
    drEllipse(x - S * .26, cy + S * .64 + leg, S * .16, S * .22);
    drEllipse(x + S * .26, cy + S * .64 - leg, S * .16, S * .22);
    ctx.fillStyle = "#6b4b8e"; drRR(x - S * .44, cy - S * .32, S * .88, S * .74, S * .15); // 机身
    ctx.fillStyle = "#8a66b0"; ctx.fillRect(x - S * .05, cy - S * .28, S * .1, S * .58);   // 中缝高光
    ctx.fillStyle = "#573d78";                                                              // 肩甲
    drRR(x - S * .62, cy - S * .34, S * .24, S * .3, S * .06);
    drRR(x + S * .38, cy - S * .34, S * .24, S * .3, S * .06);
    ctx.fillStyle = team;
    drTri(x - S * .5, cy - S * .4, x - S * .4, cy - S * .62, x - S * .3, cy - S * .4);
    drTri(x + S * .5, cy - S * .4, x + S * .4, cy - S * .62, x + S * .3, cy - S * .4);
    ctx.fillStyle = "#33234a"; drCircle(x, cy - S * .62, S * .35);                          // 头盔
    ctx.strokeStyle = "#9a7cc4"; ctx.lineWidth = 2;                                         // V 面甲
    ctx.beginPath(); ctx.moveTo(x - S * .18, cy - S * .78); ctx.lineTo(x, cy - S * .52);
    ctx.lineTo(x + S * .18, cy - S * .78); ctx.stroke();
    ctx.fillStyle = "#8df0ff"; drCircle(x - S * .12, cy - S * .62, S * .05); drCircle(x + S * .12, cy - S * .62, S * .05);
    var px = x + mir * S * .44, py = cy - S * .04, pl = S * (.72 + atk * .45);             // 大刀
    ctx.strokeStyle = "#5a5e68"; ctx.lineWidth = S * .17; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + fy * pl); ctx.stroke();
    ctx.strokeStyle = "#eef2f8"; ctx.lineWidth = S * .07;
    ctx.beginPath(); ctx.moveTo(px - S * .02, py + fy * S * .1); ctx.lineTo(px - S * .02, py + fy * pl); ctx.stroke();
    ctx.lineCap = "butt";
    if (atk > .25) { ctx.globalAlpha = atk; ctx.strokeStyle = "#9ff4ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py + fy * pl, S * .28 + atk * S * .12, 0, Math.PI * 2);
      ctx.stroke(); ctx.globalAlpha = 1; }
  } else if (u.type === "skeletons") {
    ctx.strokeStyle = "#d8d2bc"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x - S * .16, cy + S * .22 + leg); ctx.lineTo(x - S * .2, cy + S * .66);
    ctx.moveTo(x + S * .16, cy + S * .22 - leg); ctx.lineTo(x + S * .2, cy + S * .66); ctx.stroke();
    ctx.fillStyle = "#e6e1cd"; drCircle(x, cy + S * .02, S * .3);
    ctx.strokeStyle = "#b0a98f"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - S * .18, cy - S * .06); ctx.lineTo(x + S * .18, cy - S * .06);
    ctx.moveTo(x - S * .16, cy + S * .12); ctx.lineTo(x + S * .16, cy + S * .12); ctx.stroke();
    ctx.fillStyle = "#f0ebd8"; drCircle(x, cy - S * .55, S * .3);                          // 头骨
    ctx.fillStyle = "#2a2a2a"; drCircle(x - S * .11, cy - S * .57, S * .08); drCircle(x + S * .11, cy - S * .57, S * .08);
    ctx.fillRect(x - S * .02, cy - S * .52, S * .04, S * .08);
    ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - S * .08, cy - S * .32); ctx.lineTo(x - S * .08, cy - S * .26);
    ctx.moveTo(x, cy - S * .3); ctx.lineTo(x, cy - S * .25);
    ctx.moveTo(x + S * .08, cy - S * .32); ctx.lineTo(x + S * .08, cy - S * .26); ctx.stroke();
    var bx2 = x + mir * S * .32, bl = S * (.38 + atk * .3);                              // 短剑
    ctx.strokeStyle = "#6a6a6a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx2, cy + S * .1); ctx.lineTo(bx2, cy + S * .1 + fy * S * .12); ctx.stroke();
    ctx.strokeStyle = "#c8ced6"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(bx2, cy + S * .1 + fy * S * .12); ctx.lineTo(bx2, cy + S * .1 + fy * bl); ctx.stroke();
  } else if (u.type === "minions") {
    ctx.fillStyle = "#45356e";                                                            // 翅膀
    drEllipse(x - S * .58, cy - S * .08 - flap * 2.4, S * .4, S * .22, -.4);
    drEllipse(x + S * .58, cy - S * .08 - flap * 2.4, S * .4, S * .22, .4);
    ctx.fillStyle = "#6a55a0"; drCircle(x, cy, S * .36);                                  // 身体
    ctx.fillStyle = "#3a2c60";
    drTri(x - S * .2, cy - S * .3, x - S * .34, cy - S * .56, x - S * .1, cy - S * .4);  // 角
    drTri(x + S * .2, cy - S * .3, x + S * .34, cy - S * .56, x + S * .1, cy - S * .4);
    ctx.fillStyle = "#ffd760"; drCircle(x - S * .12, cy - S * .12, S * .09); drCircle(x + S * .12, cy - S * .12, S * .09);
    ctx.fillStyle = "#2a1c10"; drCircle(x - S * .12, cy - S * .12, S * .045); drCircle(x + S * .12, cy - S * .12, S * .045);
    ctx.fillStyle = "#fff"; drTri(x - S * .07, cy + S * .06, x + S * .07, cy + S * .06, x, cy + S * .16);
  } else if (u.type === "dragon") {
    ctx.fillStyle = "#d9842f";                                                            // 大翼
    drEllipse(x - S * .78, cy - S * .22 - flap * 3.2, S * .62, S * .3, -.45);
    drEllipse(x + S * .78, cy - S * .22 - flap * 3.2, S * .62, S * .3, .45);
    ctx.fillStyle = "#b84f2c"; drTri(x - S * .1, cy + S * .28, x + S * .1, cy + S * .28, x, cy + S * .28 - fy * S * .5); // 尾（身后）
    ctx.fillStyle = "#c75f34"; drCircle(x, cy, S * .5);                                   // 身体
    ctx.fillStyle = "#f2c263"; drEllipse(x, cy + S * .2, S * .28, S * .2);               // 肚皮
    ctx.fillStyle = "#e8a24a";                                                            // 角
    drTri(x - S * .2, cy - S * .42, x - S * .28, cy - S * .66, x - S * .08, cy - S * .48);
    drTri(x + S * .2, cy - S * .42, x + S * .28, cy - S * .66, x + S * .08, cy - S * .48);
    ctx.fillStyle = "#fff2b0"; drCircle(x - S * .18, cy - S * .22, S * .13); drCircle(x + S * .18, cy - S * .22, S * .13);
    ctx.fillStyle = "#2a1c10"; drCircle(x - S * .16 - mir * S * .03, cy - S * .22, S * .06);
    drCircle(x + S * .2 - mir * S * .03, cy - S * .22, S * .06);
    ctx.fillStyle = "#5a2a14"; drCircle(x - S * .07, cy - S * .02, S * .035); drCircle(x + S * .07, cy - S * .02, S * .035);
    if (atk > .55) { ctx.globalAlpha = (atk - .55) * 2.2;
      ctx.fillStyle = "#ffb040"; drCircle(x, cy + fy * S * .62, S * .26);
      ctx.fillStyle = "#ffe08a"; drCircle(x, cy + fy * S * .62, S * .13);
      ctx.globalAlpha = 1; }
  }

  /* 受击闪白 */
  if (u.hurt > 0) {
    ctx.globalAlpha = (u.hurt / .12) * .5;
    ctx.fillStyle = "#ffffff";
    drCircle(x, cy, S * .78);
    ctx.globalAlpha = 1;
  }

  /* 血条 */
  if (u.hp < u.maxHp) {
    var ratio = Math.max(0, u.hp / u.maxHp), bw = 24 * vs;
    var by = cy - S - 7;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(x - bw / 2 - .5, by - .5, bw + 1, 4.5);
    ctx.fillStyle = u.side === 1 ? "#7ec8ff" : "#ffb0a0";
    ctx.fillRect(x - bw / 2, by, bw * ratio, 3.5);
  }
}

function drawProjectiles() {
  for (var i = 0; i < battle.projectiles.length; i++) {
    var p = battle.projectiles[i];
    if (p.kind === "fire") {
      ctx.fillStyle = "#ff7a20";
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd060";
      ctx.beginPath(); ctx.arc(p.x - 1, p.y - 1, 3, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === "bolt") {
      ctx.fillStyle = "#ffe980";
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = "#e8e8e8"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 6, p.y - 2); ctx.stroke();
    }
  }
}
function drawSpells() {
  for (var i = 0; i < battle.spells.length; i++) {
    var s = battle.spells[i];
    var k = s.t / .55;
    ctx.globalAlpha = .35 + Math.sin(k * 20) * .1;
    ctx.fillStyle = "#ff5a20";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius * (1 - k * .3), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffd060"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.stroke();
  }
}
function drawFx() {
  for (var i = 0; i < battle.fx.length; i++) {
    var f = battle.fx[i], k = f.t / f.life;
    if (f.type === "ring") {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = f.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 26, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === "boom") {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = "#ffb040";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + k * .8), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (f.type === "slash") {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 8, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === "text") {
      ctx.globalAlpha = Math.max(0, 1 - k * 1.2);
      ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#000"; ctx.fillText(f.text, f.x + 1, f.y - k * 22 + 1);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - k * 22);
      ctx.globalAlpha = 1;
    }
  }
}
function drawPlacement() {
  var b = battle;
  if (!b.placing && !b.armed) return;
  var st = b.placing || { x:0, y:0, id:b.armed };
  var c = CARDS[st.id];
  var ok = deployValid(1, st.x, st.y, !!c.spell) && b.elixir >= c.cost;
  ctx.globalAlpha = .5;
  ctx.fillStyle = ok ? "rgba(120,220,255,.5)" : "rgba(255,80,80,.45)";
  ctx.beginPath(); ctx.arc(st.x, st.y, c.spell ? c.radius : 20, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = .85;
  ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(c.icon, st.x, st.y);
  ctx.globalAlpha = 1;
}

/* ============================ 战斗 HUD（手牌 / 圣水） ============================ */
function buildHandBar() {
  var hand = $("hand");
  hand.innerHTML = "";
  for (var i = 0; i < 4; i++) {
    (function (idx) {
      var el = document.createElement("div");
      el.className = "bcard";
      el.dataset.idx = idx;
      hand.appendChild(el);
    })(i);
  }
  paintHand();
}
function paintHand() {
  var els = $("hand").children;
  for (var i = 0; i < 4; i++) {
    var id = battle.hand[i], c = CARDS[id], el = els[i];
    el.dataset.card = id;
    el.innerHTML = '<span class="bcost">' + c.cost + '</span><span class="bicon">' + c.icon +
      '</span><span class="bname">' + c.name + '</span>';
    el.classList.toggle("noelixir", battle.elixir < c.cost);
    el.classList.toggle("armed", battle.armed === id && battle.armedIdx === i);
  }
}
function cycleCard(idx) {
  var used = battle.hand[idx];
  battle.hand[idx] = battle.queue.shift();
  battle.queue.push(used);
  paintHand();
}
function updateHUD() {
  if (!battle) return;
  $("elixirFill").style.width = (battle.elixir / MAX_ELIXIR * 100) + "%";
  $("elixirNum").textContent = Math.floor(battle.elixir) + " / " + MAX_ELIXIR;
  $("crownMe").textContent = "🏰 " + battle.crownMe;
  $("crownFoe").textContent = battle.crownFoe + " 🏰";
  var t = (battle.overtime ? OT_TIME : MATCH_TIME) - battle.t;
  t = Math.max(0, Math.ceil(t));
  $("timer").textContent = (battle.overtime ? "加时 " : "") + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  var els = $("hand").children;
  for (var i = 0; i < 4; i++) {
    if (els[i]) els[i].classList.toggle("noelixir", battle.elixir < CARDS[battle.hand[i]].cost);
  }
}

/* ============================ 触摸 / 鼠标输入（统一管线，立即反馈 ≤1帧） ============================ */
function toLogical(clientX, clientY) {
  var rect = stage.getBoundingClientRect();
  return { x: (clientX - rect.left) / rect.width * W, y: (clientY - rect.top) / rect.height * H };
}
var activeTouches = {}; // id -> dragState

function cardAtTarget(target) {
  while (target && target !== stage) {
    if (target.className && (" " + target.className + " ").indexOf(" bcard ") >= 0) return target;
    target = target.parentNode;
  }
  return null;
}
function beginDrag(cardEl, p) {
  var idx = parseInt(cardEl.dataset.idx, 10);
  var id = battle.hand[idx];
  if (battle.elixir < CARDS[id].cost) { battle.placing = null; return; }
  battle.placing = { id:id, idx:idx, x:p.x, y:p.y };
  battle.armed = null; battle.armedIdx = -1;
  cardEl.classList.add("dragging");
  paintHand();
}
function onPointerDown(x, y, target, pointerId) {
  if (!battle || battle.state !== "play") return;
  AudioSys.ensure();
  var cardEl = cardAtTarget(target);
  if (cardEl) {
    var p = toLogical(x, y);
    beginDrag(cardEl, p);
    activeTouches[pointerId] = { cardEl:cardEl, sx:x, sy:y, moved:false };
    return;
  }
  // 已点选（armed）模式：点击场地出兵
  if (battle.armed) {
    var pp = toLogical(x, y);
    tryPlace(battle.armed, battle.armedIdx, pp.x, pp.y);
  }
}
function onPointerMove(x, y, pointerId) {
  var st = activeTouches[pointerId];
  if (st) { if (Math.abs(x - st.sx) + Math.abs(y - st.sy) > 10) st.moved = true; }
  if (battle && battle.placing) {
    var p = toLogical(x, y);
    battle.placing.x = p.x; battle.placing.y = p.y;
  }
}
function onPointerUp(x, y, pointerId) {
  var st = activeTouches[pointerId];
  var p = toLogical(x, y);
  if (battle && battle.placing) {
    var pl = battle.placing;
    if (st && st.moved) {
      // 拖拽释放
      tryPlace(pl.id, pl.idx, p.x, p.y);
    } else {
      // 轻点卡片：进入点选模式
      battle.armed = pl.id; battle.armedIdx = pl.idx;
      paintHand();
    }
    battle.placing = null;
    if (st && st.cardEl) st.cardEl.classList.remove("dragging");
  } else if (battle && battle.armed && st && st.cardEl) {
    // 在卡片上再次点按 → 取消选择
    battle.armed = null; battle.armedIdx = -1; paintHand();
  }
  delete activeTouches[pointerId];
}
function tryPlace(id, idx, x, y) {
  if (deployCard(1, id, x, y)) {
    cycleCard(idx);
    battle.armed = null; battle.armedIdx = -1;
  }
}

// 触摸（passive:false 才能在容器内阻止滚动）
stage.addEventListener("touchstart", function (e) {
  if ($("battle").classList.contains("show")) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var tch = e.changedTouches[i];
      onPointerDown(tch.clientX, tch.clientY, tch.target, tch.identifier);
    }
  }
}, { passive:false });
stage.addEventListener("touchmove", function (e) {
  if ($("battle").classList.contains("show")) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var tch = e.changedTouches[i];
      onPointerMove(tch.clientX, tch.clientY, tch.identifier);
    }
  }
}, { passive:false });
stage.addEventListener("touchend", function (e) {
  if ($("battle").classList.contains("show")) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var tch = e.changedTouches[i];
      onPointerUp(tch.clientX, tch.clientY, tch.identifier);
    }
  }
}, { passive:false });
// 鼠标（桌面调试）
var mouseDown = false;
stage.addEventListener("mousedown", function (e) {
  if (!$("battle").classList.contains("show")) return;
  mouseDown = true;
  onPointerDown(e.clientX, e.clientY, e.target, "mouse");
});
window.addEventListener("mousemove", function (e) { if (mouseDown) onPointerMove(e.clientX, e.clientY, "mouse"); });
window.addEventListener("mouseup", function (e) {
  if (mouseDown) { mouseDown = false; onPointerUp(e.clientX, e.clientY, "mouse"); }
});

/* ============================ 新手引导 ============================ */
var TUT_STEPS = [
  { icon:"💧", title:"圣水", text:"底部紫条是圣水，最多储存 10 滴并自动恢复。每张卡牌右上角标注了出兵费用。" },
  { icon:"👆", title:"拖动部署", text:"按住下方卡牌，拖到己方亮绿色半场松手即可出兵；也可以轻点卡牌选中、再点场地出兵。" },
  { icon:"🌉", title:"过桥进攻", text:"部队会自动沿两座桥过河攻击敌人。空军（飞龙、亡灵）可以直接飞过河面。" },
  { icon:"🏰", title:"摧毁塔防", text:"先推掉一座公主塔，就能在敌方半场部署部队。摧毁国王塔立即获胜，3 分钟战平则进入加时赛！" }
];
var tutStep = 0, tutFreeMode = false;
function startTutorial(freeMode) {
  tutStep = 0; tutFreeMode = !!freeMode;
  if (!freeMode) {
    // 引导中开启一场练习战（敌人冻结）；已在战场则仅冻结 AI
    if (!battle) enterBattle(true);
    else battle.aiFrozen = true;
  }
  $("tut").classList.add("show");
  paintTut();
}
function paintTut() {
  var s = TUT_STEPS[tutStep];
  $("tutIcon").textContent = s.icon;
  $("tutTitle").textContent = s.title;
  $("tutText").textContent = s.text;
  $("tutDots").textContent = (tutStep + 1) + " / " + TUT_STEPS.length;
  $("tutNext").textContent = tutStep === TUT_STEPS.length - 1 ? "开始战斗！" : "下一步";
}
$("tutNext").addEventListener("click", function () {
  tutStep++;
  if (tutStep >= TUT_STEPS.length) {
    $("tut").classList.remove("show");
    if (!save.tutorialDone) { save.tutorialDone = true; persist(); }
    if (battle) battle.aiFrozen = false;
    if (tutFreeMode) { /* 从主界面直接看教程则回主界面 */ show("home"); }
  } else paintTut();
});

/* ============================ 进入战斗 / 主循环 ============================ */
function enterBattle(practice) {
  AudioSys.ensure();
  battle = newBattle();
  if (practice) battle.aiFrozen = true;
  buildHandBar();
  updateHUD();
  show("battle");
}
$("btnBattle").addEventListener("click", function () {
  enterBattle(false);
  if (!save.tutorialDone) startTutorial(false);
});

/* 固定步长（30Hz 逻辑），渲染跟随 rAF，保证中低端机稳定 */
var STEP = 1 / 30, acc = 0, lastT = performance.now();
var fpsAcc = 0, fpsN = 0, fpsShown = 0;
function frame(now) {
  var dtms = now - lastT; lastT = now;
  if (dtms > 200) dtms = 200; // 切后台恢复时防止大步长
  acc += dtms / 1000;
  var n = 0;
  while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
  if (battle) render(); else { ctx.clearRect(0, 0, W, H); }
  updateHUD();
  // FPS 采样
  fpsAcc += dtms; fpsN++;
  if (fpsAcc >= 1000) { fpsShown = Math.round(1000 / (fpsAcc / fpsN)); fpsAcc = 0; fpsN = 0; $("fpsTag").textContent = fpsShown + " FPS"; }
  requestAnimationFrame(frame);
}

/* ============================ 启动 ============================ */
loadSave();
refreshHome();
show("home");
requestAnimationFrame(frame);

/* 暴露给自动化测试 */
window.__G = {
  get battle() { return battle; },
  enter: function () { enterBattle(false); if (battle) battle.aiFrozen = true; },
  deploy: function (id, x, y) { return battle && deployCard(1, id, x, y); },
  place: function (id, x, y) {
    // 玩家完整出兵路径：校验+扣圣水+手牌循环（与真实触摸操作一致）
    if (!battle) return false;
    var idx = battle.hand.indexOf(id);
    if (idx < 0) return false;
    if (deployCard(1, id, x, y)) { cycleCard(idx); return true; }
    return false;
  },
  step: function (n, dt) {
    var d = dt || STEP;
    for (var i = 0; i < n; i++) update(d);
  },
  save: function () { return save; },
  upgrade: function (id) {
    var lvl = cardLvl(id), cost = upgradeCost(lvl), info = save.cards[id];
    if (info && info.copies >= cost.copies && save.gold >= cost.gold && lvl < 10) {
      info.copies -= cost.copies; save.gold -= cost.gold; info.lvl++; persist(); return true;
    }
    return false;
  },
  grant: function (id, n) {
    if (!save.cards[id]) save.cards[id] = { lvl:1, copies:0 };
    save.cards[id].copies += n; persist();
  },
  setTrophy: function (n) { save.trophy = n; persist(); },
  forceEnd: function (r) { endMatch(r); }
};
</script>
